services:
  php:
    environment:
      MERCURE_PUBLIC_URL: http://frontend/.well-known/mercure
      DEFAULT_URI: http://frontend
      MAILER_DSN: smtp://mailer:1025

  playwright:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v1.61.0-noble
    working_dir: /work/client
    depends_on:
      frontend:
        condition: service_healthy
      mailer:
        condition: service_healthy
    environment:
      CI: "1"
      NODE_PATH: ./node_modules
      E2E_BASE_URL: http://frontend
      E2E_EXTERNAL_SERVER: "1"
      E2E_MAILPIT_URL: http://mailer:8025
    volumes:
      - ./client/package.json:/work/client/package.json:ro
      - ./client/package-lock.json:/work/client/package-lock.json:ro
      - ./client/playwright.config.ts:/work/client/playwright.config.ts:ro
      - ./tests:/work/tests:ro
      - ./playwright-report:/work/playwright-report
      - ./test-results:/work/test-results
      - playwright_node_modules:/work/client/node_modules
    command: [sh, -lc, "npm ci --no-audit --fund=false && npm run test:e2e"]
    networks: [frontend-net, backend-net]

volumes:
  playwright_node_modules: {}
