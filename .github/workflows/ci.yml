name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5.12'
          extensions: pdo_pgsql, intl, mbstring, dom, xml, zip
          tools: composer:2.10.3
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: composer install --working-dir=server --no-scripts --prefer-dist --no-interaction
      - run: make test
      - run: npm ci && npm run build
        working-directory: client

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      APP_VERSION: sha-${{ github.sha }}
      ENV_FILE: .env.ci
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure test build
        shell: bash
        run: |
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          cp .env.ci .env
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/social-network" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images once
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          files: |
            compose.yaml
            compose.build.yaml
          targets: frontend,backend-proxy,php,s3,s3-init
          load: true
          set: |
            *.labels.org.opencontainers.image.source=https://github.com/${{ github.repository }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            frontend.cache-from=type=registry,ref=${{ env.IMAGE_PREFIX }}-frontend:buildcache
            frontend.cache-to=type=registry,ref=${{ env.IMAGE_PREFIX }}-frontend:buildcache,mode=max
            backend-proxy.cache-from=type=registry,ref=${{ env.IMAGE_PREFIX }}-proxy:buildcache
            backend-proxy.cache-to=type=registry,ref=${{ env.IMAGE_PREFIX }}-proxy:buildcache,mode=max
            php.cache-from=type=registry,ref=${{ env.IMAGE_PREFIX }}-backend:buildcache
            php.cache-to=type=registry,ref=${{ env.IMAGE_PREFIX }}-backend:buildcache,mode=max
            s3.cache-from=type=registry,ref=${{ env.IMAGE_PREFIX }}-storage:buildcache
            s3.cache-to=type=registry,ref=${{ env.IMAGE_PREFIX }}-storage:buildcache,mode=max
            s3-init.cache-from=type=registry,ref=${{ env.IMAGE_PREFIX }}-storage-init:buildcache
            s3-init.cache-to=type=registry,ref=${{ env.IMAGE_PREFIX }}-storage-init:buildcache,mode=max
      - name: Start tested images
        run: make e2e-up TEST_IMAGE_PREFIX="$IMAGE_PREFIX" TEST_IMAGE_TAG="$APP_VERSION"
      - name: Playwright
        run: make e2e-run TEST_IMAGE_PREFIX="$IMAGE_PREFIX" TEST_IMAGE_TAG="$APP_VERSION"
      - name: Publish tested images
        shell: bash
        run: |
          for image in frontend backend proxy storage storage-init; do
            source="$IMAGE_PREFIX-$image:$APP_VERSION"
            release="$IMAGE_PREFIX-$image:$RELEASE_VERSION"
            docker tag "$source" "$release"
            docker push "$source"
            docker push "$release"
          done
      - name: Collect container logs
        if: failure()
        run: |
          IMAGE_PREFIX="$IMAGE_PREFIX" APP_VERSION="$APP_VERSION" docker compose -p social-network-e2e --env-file .env.ci -f compose.yaml -f compose.e2e.yaml --profile mailpit logs --no-color > compose.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright
          path: |
            playwright-report
            test-results
            compose.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove test stack
        if: always()
        run: make e2e-down TEST_IMAGE_PREFIX="$IMAGE_PREFIX" TEST_IMAGE_TAG="$APP_VERSION"
