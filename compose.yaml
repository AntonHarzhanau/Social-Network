name: social-network

services:
  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/antonharzhanau/social-network}-frontend:${APP_VERSION:?Set APP_VERSION}
    restart: unless-stopped

    depends_on:
      backend-proxy:
        condition: service_healthy
    ports:
      - "${HTTP_BIND_IP:-0.0.0.0}:${HTTP_PORT:-8080}:80"
    networks: [frontend-net]

  backend-proxy:
    image: ${IMAGE_PREFIX:-ghcr.io/antonharzhanau/social-network}-proxy:${APP_VERSION:?Set APP_VERSION}
    restart: unless-stopped
    depends_on:
      php:
        condition: service_healthy
      mercure:
        condition: service_healthy
      s3:
        condition: service_healthy
    networks: [frontend-net, gateway-net]

  php:
    image: ${IMAGE_PREFIX:-ghcr.io/antonharzhanau/social-network}-backend:${APP_VERSION:?Set APP_VERSION}
    restart: unless-stopped
    env_file: ["${ENV_FILE:-.env}"]
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      TRUSTED_PROXIES: REMOTE_ADDR
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-social_network}?serverVersion=16&charset=utf8"
      MERCURE_URL: http://mercure/.well-known/mercure
      AWS_ENDPOINT: http://s3:9000
      AWS_PUBLIC_ENDPOINT: /media
      JWT_SECRET_KEY: /var/www/app/config/jwt/private.pem
      JWT_PUBLIC_KEY: /var/www/app/config/jwt/public.pem
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}
      MAILER_DSN: ${MAILER_DSN:?Set MAILER_DSN}
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      mercure:
        condition: service_healthy
    volumes:
      - symfony_var:/var/www/app/var
      - jwt_keys:/var/www/app/config/jwt
    networks: [gateway-net, backend-net, egress]

  postgres:
    image: postgres:16.15-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-social_network}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [backend-net]

  mercure:
    image: dunglas/mercure:v1.1.4
    restart: unless-stopped
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET}
      MERCURE_EXTRA_DIRECTIVES: |
        protocol_version_compatibility 8
        anonymous
        cors_origins *
    networks: [gateway-net, backend-net]

  s3:
    image: ${IMAGE_PREFIX:-ghcr.io/antonharzhanau/social-network}-storage:${APP_VERSION:?Set APP_VERSION}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - s3_data:/data
    networks: [gateway-net, backend-net]

  s3-init:
    image: ${IMAGE_PREFIX:-ghcr.io/antonharzhanau/social-network}-storage-init:${APP_VERSION:?Set APP_VERSION}
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      AWS_BUCKET: social-network-media
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}
    depends_on:
      s3:
        condition: service_healthy
    networks: [backend-net]

  mailer:
    profiles: [mailpit]
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    networks: [backend-net]

volumes:
  postgres_data: {}
  s3_data: {}
  symfony_var: {}
  jwt_keys: {}

networks:
  frontend-net: {}
  gateway-net:
    internal: true
  backend-net:
    internal: true
  egress: {}
