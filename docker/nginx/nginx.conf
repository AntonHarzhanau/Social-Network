events { worker_connections 1024; }

http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream symfony { zone symfony 64k; server php:9000 resolve; }
  upstream mercure_hub { zone mercure_hub 64k; server mercure:80 resolve; }
  upstream storage { zone storage 64k; server s3:9000 resolve; }
  server_tokens off;
  client_max_body_size 64m;

  server {
    listen 80;
    server_name _;

    location = /health { return 200 "ok\n"; }
    location / { return 404; }

    location ~ ^/api(?:/|$) {
      fastcgi_pass symfony;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
      fastcgi_param SCRIPT_NAME /index.php;
      fastcgi_param DOCUMENT_ROOT /var/www/app/public;
      fastcgi_param HTTP_HOST $http_host;
      fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
      fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
    }

    location = /.well-known/mercure {
      proxy_pass http://mercure_hub;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_request_buffering off;
    }

    location /media/ {
      proxy_pass http://storage/social-network-media/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }
  }
}
